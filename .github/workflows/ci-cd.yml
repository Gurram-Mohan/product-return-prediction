# ============================================================================
# CI/CD pipeline for the E-Commerce Product Return Prediction system
#
#   1. quality  -> install dependencies, lint (ruff), retrain + evaluate the
#                  models, run the automated pytest suite
#   2. publish  -> build the Docker image, push it to GitHub Container
#                  Registry (ghcr.io), then smoke-test the pushed image
#                  against the /health and /predict endpoints
#
# The publish job only runs after a successful quality gate on every push to
# main, so a failing test or lint error can never ship an image.
# ============================================================================
name: CI/CD - Product Return Prediction

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Never run two copies of the pipeline for the same branch at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # STAGE 1: dependency install + code validation + automated testing
  # ==========================================================================
  quality:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint code (ruff)
        run: ruff check .

      - name: Train models & evaluate (validates training pipeline)
        run: python -m src.train

      - name: Run automated tests (pytest)
        run: pytest -v

  # ==========================================================================
  # STAGE 2: build Docker image and publish to GHCR
  # ==========================================================================
  publish:
    name: Build & Publish Docker image to GHCR
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image name (must be lowercase)
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Read model version for image tagging
        id: version
        run: echo "version=$(grep -oP 'MODEL_VERSION = \"\K[^\"]+' src/config.py)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.image.outputs.name }}:latest" \
            --tag "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}" \
            --tag "${{ steps.image.outputs.name }}:sha-${{ github.sha }}" \
            .

      - name: Smoke test image locally (/health + /predict)
        run: |
          IMAGE="${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
          docker run -d --name smoke -p 8000:8000 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > health.json; then break; fi
            sleep 2
          done
          echo "--- /health response ---"; cat health.json; echo
          grep -q '"status":"healthy"' health.json || grep -q '"status": "healthy"' health.json
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"product_category":"Electronics","product_price_inr":22055.97,"discount_percent":21.6,"expected_delivery_days":9,"actual_delivery_days":12,"customer_rating_preorder":4.4,"previous_returns":0,"previous_orders":33,"payment_method":"Card","damaged_package_flag":"No","package_size":"Large","promotion_active":"Yes","order_id":"SMOKE-1"}' > predict.json
          echo "--- /predict response ---"; cat predict.json; echo
          grep -qE '"prediction":"(Returned|Not Returned)"' predict.json || \
          grep -qE '"prediction": "(Returned|Not Returned)"' predict.json
          docker rm -f smoke

      - name: Push image to GHCR
        run: |
          docker push "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"
          docker push "${{ steps.image.outputs.name }}:sha-${{ github.sha }}"

      - name: Publish job summary
        run: |
          echo "## Docker image published :whale:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: \`latest\`, \`${{ steps.version.outputs.version }}\`, \`sha-${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull it with:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.image.outputs.name }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # import order
    "B",  # bugbear (common bugs)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
